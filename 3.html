<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Посты пользователей</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #eef2f5;
            padding: 30px;
        }
        .app {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .top-panel {
            background: #404c3d;
            padding: 20px;
        }
        .top-panel h3 {
            color: white;
            margin-bottom: 12px;
            font-size: 16px;
        }
        .user-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .user-btn {
            background: #588577;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
        }
        .user-btn.active {
            background: #1abc9c;
        }

        .posts-panel {
            padding: 25px;
        }
        .posts-title {
            font-size: 20px;
            font-weight: bold;
            color: #404c3d;
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 3px solid #1abc9c;
        }
        .post-card {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .post-author {
            font-size: 12px;
            color: #7f8c8d;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid #eaeaea;
        }
        .post-author span {
            color: #1abc9c;
            font-weight: bold;
        }
        .post-title {
            font-weight: bold;
            font-size: 17px;
            margin: 8px 0;
            color: #588577;
        }
        .post-body {
            font-size: 14px;
            color: #555;
            line-height: 1.5;
        }
        .placeholder {
            text-align: center;
            color: #999;
            padding: 40px;
        }
    </style>
</head>
<body>

<div class="app">

    <div class="top-panel">
        <h3>Список пользователей</h3>
        <div class="user-list" id="userList"></div>
    </div>

    <div class="posts-panel" id="postsPanel">
        <div class="placeholder">Нажмите на пользователя</div>
    </div>
</div>

<script>
    const users = [
        { id: 1, name: "Leanne Graham", username: "Bret" },
        { id: 2, name: "Ervin Howell", username: "Antonette" },
        { id: 3, name: "Clementine Bauch", username: "Samantha" },
        { id: 4, name: "Patricia Lebsack", username: "Karianne" },
        { id: 5, name: "Chelsey Dietrich", username: "Kamren" },
        { id: 6, name: "Mrs. Dennis Schulist", username: "Leopoldo_Corkery" },
        { id: 7, name: "Kurtis Weissnat", username: "Elwyn.Skiles" },
        { id: 8, name: "Nicholas Runolfsdottir V", username: "Maxime_Nienow" },
        { id: 9, name: "Glenna Reichert", username: "Delphine" },
        { id: 10, name: "Clementina DuBuque", username: "Moriah.Stanton" }
    ];

    const posts = [
        { userId: 1, title: "sunt aut facere", body: "quia et suscipit suscipit recusandae consequuntur" },
        { userId: 1, title: "qui est esse", body: "est rerum tempore vitae sequi sint nihil" },
        { userId: 1, title: "ea molestias quasi", body: "et iusto sed quo iure voluptatem occaecati" },
        { userId: 2, title: "et ea vero quia", body: "delectus reiciendis molestiae occaecati non minima" },
        { userId: 2, title: "in quibusdam tempore", body: "itaque id aut magnam praesentium" },
        { userId: 3, title: "asperiores ea ipsam", body: "repellat aliquid praesentium dolorem quo" },
        { userId: 3, title: "dolor sint quo a", body: "eos qui et ipsum ipsam suscipit aut" }
    ];

    let currentUserId = 1;

    function render() {
        const userContainer = document.getElementById('userList');
        userContainer.innerHTML = users.map(u => `
            <button class="user-btn ${u.id === currentUserId ? 'active' : ''}"
                    onclick="currentUserId = ${u.id}; render()">
                ${u.name}
            </button>
        `).join('');

        const user = users.find(u => u.id === currentUserId);
        const userPosts = posts.filter(p => p.userId === currentUserId);
        const postsContainer = document.getElementById('postsPanel');

        if (userPosts.length === 0) {
            postsContainer.innerHTML = `<div class="posts-title">Посты пользователя: ${user.name}</div>
                                         <div class="placeholder">Нет постов</div>`;
            return;
        }

        postsContainer.innerHTML = `
            <div class="posts-title">Посты пользователя: ${user.name}</div>
            ${userPosts.map(p => `
                <div class="post-card">
                    <div class="post-author">Автор: <span>${user.name}</span> (@${user.username})</div>
                    <div class="post-title">${p.title}</div>
                    <div class="post-body">${p.body}</div>
                </div>
            `).join('')}
        `;
    }

    render();
</script>
</body>
</html>
